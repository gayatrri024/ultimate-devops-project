apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ultimate-devops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gayatrri024/ultimate-devops-project.git
    targetRevision: main
    path: helm/ultimate-devops

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
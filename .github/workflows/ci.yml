 name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - product-service
          - order-service
          - user-service

    defaults:
      run:
        working-directory: app/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service:
          - product-service
          - order-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t gayatri1702/${{ matrix.service }}:${{ github.sha }} \
            -t gayatri1702/${{ matrix.service }}:latest \
            ./app/${{ matrix.service }}

      - name: Push Docker images
        run: |
          docker push gayatri1702/${{ matrix.service }}:${{ github.sha }}
          docker push gayatri1702/${{ matrix.service }}:latest